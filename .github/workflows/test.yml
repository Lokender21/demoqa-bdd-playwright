name: DemoQA BDD Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  test:
    name: Run BDD Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1 - Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2 - Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      # Step 3 - Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4 - Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      # Step 5 - Run all BDD tests
      - name: Run Cucumber BDD Tests
        run: npm test
        continue-on-error: true    # continue even if tests fail so report is generated

      # Step 6 - Generate HTML report
      - name: Generate HTML Report
        run: node generateReport.js
        if: always()               # always run this even if tests fail

      # Step 7 - Upload report as artifact (downloadable from GitHub)
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-html-report
          path: reports/html/
          retention-days: 30

      # Step 8 - Upload screenshots if any failures
      - name: Upload Failure Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-screenshots
          path: reports/screenshots/
          retention-days: 7
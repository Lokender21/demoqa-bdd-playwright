name: DemoQA BDD Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run BDD Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies (CRITICAL FIX)
      - name: Install Dependencies
        run: npm ci

      # 4. Install ALL Playwright browsers (IMPORTANT FIX)
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 5. Run BDD tests
      - name: Run Cucumber BDD Tests
        run: npm test

      # 6. Generate HTML report (only if script exists)
      - name: Generate HTML Report
        run: node generateReport.js
        if: always()

      # 7. Upload HTML report
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-html-report
          path: reports/html/
          retention-days: 30

      # 8. Upload screenshots (only if folder exists)
      - name: Upload Failure Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-screenshots
          path: reports/screenshots/
          retention-days: 7